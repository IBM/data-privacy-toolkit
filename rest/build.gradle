plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ibm.research.drl.dpt'
version = '7.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    jackson_version = '2.23.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-csv:${jackson_version}"
    implementation 'org.apache.commons:commons-csv:1.14.1'

    implementation "${group}:data-privacy-toolkit:${version}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The sample data set served by the web UI is also what the tests use: there is a single copy of it.
tasks.named('processTestResources') {
    from('front-end/public/datasets') {
        include 'healthcare-dataset.txt'
    }
}

// End-to-end smoke test of the web UI: builds front-end/, serves it from this application and drives it with a
// headless Chrome. It needs Chrome or Chromium and either Node >= 22 or Docker, so it is not part of `check`:
//   ./gradlew uiSmokeTest
tasks.register('uiSmokeTest', Exec) {
    group = 'verification'
    description = 'Runs the web UI against this back-end in a headless browser (see ui-smoke/README.md).'

    dependsOn 'bootJar'
    environment 'DPT_REST_JAR', tasks.named('bootJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    commandLine 'bash', "${projectDir}/ui-smoke/run.sh"
}
