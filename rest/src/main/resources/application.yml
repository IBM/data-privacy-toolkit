server:
  # Loopback by default. Override with SERVER_ADDRESS / SERVER_PORT, e.g. SERVER_ADDRESS=0.0.0.0 inside a
  # container whose port is published on the host loopback interface only.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
demo:
  dataset: 'fictitious-dataset-location'
  master: local[*]