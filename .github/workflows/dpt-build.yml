name: DataPrivacyToolkit
on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
# Nothing here writes to the repository: the token only needs to read it.
permissions:
  contents: read
jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
        distribution: ['temurin', 'corretto', 'microsoft']
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      - name: Run gradlew build
        working-directory: ./library
        run: ./gradlew build --no-daemon

  spark:
    name: Spark
    needs: library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
        distribution: ['temurin']
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      - name: Run gradlew publish to maven local
        working-directory: ./library
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Run gradlew build
        working-directory: ./spark
        run: ./gradlew build --no-daemon

  rest:
    name: REST
    needs: library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
        distribution: ['temurin', 'corretto', 'microsoft']
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      - name: Run gradlew publish to maven local
        working-directory: ./library
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Run gradlew build
        working-directory: ./rest
        run: ./gradlew build --no-daemon

  docker:
    name: Docker
    needs: library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
        distribution: ['temurin', 'corretto', 'microsoft']
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      - name: Run gradlew publish to maven local
        working-directory: ./library
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Run gradlew build
        working-directory: ./docker
        run: ./gradlew build --no-daemon

  front-end:
    name: REST web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rest/front-end
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: rest/front-end/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        # Only what ships, and only what matters: an advisory in a dev tool must not fail unrelated pull requests.
        run: npm audit --omit=dev --audit-level=high

  rest-image:
    name: REST container image
    needs: [ library, front-end ]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dpt-rest:test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f rest/Dockerfile -t $IMAGE_NAME .
      - name: Start the hardened container
        run: |
          docker run -d --name dpt-rest -e SERVER_ADDRESS=0.0.0.0 -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop=ALL --security-opt=no-new-privileges $IMAGE_NAME
      - name: Check that the UI and the API are served
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/api/information/identifiers && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/
          curl -sf -o /dev/null http://127.0.0.1:8080/datasets/simple.csv
          test "$(docker exec dpt-rest id -u)" != "0"
      - name: Show the container log on failure
        if: failure()
        run: docker logs dpt-rest

  end-to-end:
    name: End to end test
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dpt-image:test
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Run gradlew publish to maven local
        working-directory: ./library
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Run gradlew to build toolkit
        working-directory: ./docker
        run: ./gradlew shadowJar -x test --no-daemon
      - name: Build docker image
        working-directory: ./docker
        run: docker build -t $IMAGE_NAME .
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: '**/requirements-dev.txt'
      - name: Install pytest
        working-directory: ./docker
        run: pip install -r ./requirements-dev.txt
      - name: Run end-to-end tests
        working-directory: ./docker
        run: pytest scripts/e2e_tests
